<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>File Server Dropzone</title>

        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
            }
            body {
                font-family: Arial, sans-serif;
                box-sizing: border-box;
            }
            #container {
                width: 100%;
                padding: 80px;
                box-sizing: border-box;
            }
            fs-dropzone {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <form
            id="container"
            action="/upload"
            method="post"
            enctype="multipart/form-data"
        >
            <fs-dropzone
                accepted-file-types='["application/pdf", "image/*"]'
            ></fs-dropzone>
            <button type="submit" style="margin-top: 50px">Submit form</button>
        </form>
        <script type="module" src="/src/index.ts"></script>
    </body>
</html>
